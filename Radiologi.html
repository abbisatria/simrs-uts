<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiologi - SIMKES</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="kasir.html">Kasir</a>
        <a class="active" href="Radiologi.html">Radiologi</a>
        <a href="Laboratorium.html">Laboratorium</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Radiologi</h2>
            <div class="form-group">
                <input id="input-nama-radiologi" type="text" placeholder="Nama Pasien">
            </div>
            <div class="form-group">
                <select id="select-radiologi">
                    <option>X-Ray</option>
                    <option>CT Scan</option>
                    <option>MRI</option>
                    <option>USG</option>
                </select>
            </div>
            <div class="form-group">
                <input id="input-hasil-radiologi" placeholder="Hasil Radiologi">
            </div>
            <button id="btn-simpan-radiologi">Simpan Hasil</button>
        </div>

        <div class="card">
            <h2>Data Radiologi</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>
                <tbody id="tbody-radiologi"></tbody>
            </table>
        </div>

    </div>
    <script src="Script.js"></script>
</body>

</html>
