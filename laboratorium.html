<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES - Laboratorium</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>SIMKES</h2>

        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="kasir.html">Kasir</a>
        <a class="active" href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="login.html">Logout</a>
    </div>

    <!-- CONTENT -->
    <div class="main">

        <!-- FORM LABORATORIUM -->
        <div class="card">
            <h2>Laboratorium</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">
            <br><br>

            <select id="pemeriksaan">
                <option value="">Pilih Pemeriksaan</option>
                <option>Hematologi</option>
                <option>Urine</option>
                <option>Kimia Darah</option>
                <option>Gula Darah</option>
            </select>

            <br><br>

            <input type="text" id="hasil" placeholder="Hasil Laboratorium">

            <br><br>

            <button onclick="simpanData()">
                Simpan Hasil
            </button>
        </div>

        <!-- TABEL DATA -->
        <div class="card">
            <h2>Data Laboratorium</h2>

            <table border="1" width="100%">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>

                <tbody id="tabelLab">
                </tbody>
            </table>
        </div>

    </div>

    <script>

        // Ambil data dari localStorage
        let dataLab =
            JSON.parse(localStorage.getItem("dataLab")) || [];

        // Tampilkan data saat halaman pertama kali dibuka
        tampilkanData();

        function simpanData() {

            let pasien =
                document.getElementById("namaPasien").value;

            let pemeriksaan =
                document.getElementById("pemeriksaan").value;

            let hasil =
                document.getElementById("hasil").value;

            if (pasien === "" || pemeriksaan === "" || hasil === "") {
                alert("Semua data harus diisi!");
                return;
            }

            // Simpan ke array
            dataLab.push({
                pasien: pasien,
                pemeriksaan: pemeriksaan,
                hasil: hasil
            });

            // Simpan ke localStorage
            localStorage.setItem(
                "dataLab",
                JSON.stringify(dataLab)
            );

            // Tampilkan ulang tabel
            tampilkanData();

            // Kosongkan form
            document.getElementById("namaPasien").value = "";
            document.getElementById("pemeriksaan").value = "";
            document.getElementById("hasil").value = "";

            alert("Data laboratorium berhasil disimpan!");
        }

        function tampilkanData() {

            let html = "";

            dataLab.forEach((item, index) => {

                html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.pasien}</td>
                    <td>${item.pemeriksaan}</td>
                    <td>${item.hasil}</td>
                </tr>
                `;

            });

            document.getElementById("tabelLab").innerHTML = html;
        }

    </script>

</body>

</html>
