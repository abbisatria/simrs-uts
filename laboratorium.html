<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="radiologi.html">Radiologi</a>
        <a class="active" href="laboratorium.html">Laboratorium</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Laboratorium</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">

            <select id="pemeriksaan">
                <option value="">-- Pilih Pemeriksaan --</option>
                <option>Hematologi</option>
                <option>Urinalisis</option>
                <option>Kimia Klinik</option>
                <option>Mikrobiologi</option>
            </select>

            <input type="text" id="hasilLab" placeholder="Hasil Laboratorium">

            <button onclick="simpanLab()">Simpan Hasil</button>
            <button onclick="hapusData()">Hapus Data</button>
        </div>

        <div class="card">
            <h2>Data Pemeriksaan Lab</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>

                <tbody id="dataLab"></tbody>
            </table>
        </div>

    </div>

    <script>
        let laboratorium = JSON.parse(
            localStorage.getItem("laboratorium")
        ) || [];

        renderTable();

        function simpanLab() {
            let pasien = document.getElementById("namaPasien").value;
            let pemeriksaan = document.getElementById("pemeriksaan").value;
            let hasil = document.getElementById("hasilLab").value;

            if (pasien && pemeriksaan && hasil) {

                laboratorium.push({
                    pasien: pasien,
                    pemeriksaan: pemeriksaan,
                    hasil: hasil
                });

                localStorage.setItem(
                    "laboratorium",
                    JSON.stringify(laboratorium)
                );

                console.log(laboratorium);

                renderTable();

                document.getElementById("namaPasien").value = "";
                document.getElementById("pemeriksaan").selectedIndex = 0;
                document.getElementById("hasilLab").value = "";

                alert("Data laboratorium berhasil disimpan");

            } else {
                alert("Semua data harus diisi");
            }
        }

        function renderTable() {
            let html = "";

            laboratorium.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.pasien}</td>
                        <td>${item.pemeriksaan}</td>
                        <td>${item.hasil}</td>
                    </tr>
                `;
            });

            document.getElementById("dataLab").innerHTML = html;
        }

        function hapusData() {
            if (confirm("Yakin ingin menghapus semua data?")) {
                localStorage.removeItem("laboratorium");
                laboratorium = [];
                renderTable();
            }
        }
    </script>

</body>

</html>
