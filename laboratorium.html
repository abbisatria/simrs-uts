<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a class="active" href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Laboratorium</h2>
            <input placeholder="Nama Pasien">
            <select>
                <option>Hematologi</option>
                <option>Kimia Klinik</option>
                <option>Urinalisa</option>
                <option>Mikrobiologi</option>
                <option>Imunologi</option>
                <option>Tes Gula Darah</option>
                <option>Kolesterol</option>
                <option>Asam Urat</option>
                <option>Fungsi Hati</option>
                <option>Fungsi Ginjal</option>
            </select>
            <input placeholder="Hasil Laboratorium">
            <button>Simpan Hasil</button>
        </div>

        <div class="card">
            <h2>Data Pemeriksaan Lab</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Pemeriksaan</th>
                    <th>Hasil</th>
                </tr>
                <tr>
                    <td>Siti</td>
                    <td>Hematologi</td>
                    <td>Normal</td>
                </tr>
            </table>
        </div>

    </div>
</body>

</html>
