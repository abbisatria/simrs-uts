<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="kasir.html">Kasir</a>
        <a class="active" href="radiologi.html">Radiologi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Radiologi</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">

            <select id="jenisPemeriksaan">
                <option>X-Ray</option>
                <option>USG</option>
                <option>MRI</option>
            </select>

            <input type="text" id="hasilRadiologi" placeholder="Hasil Radiologi">

            <button onclick="simpanRadiologi()">Simpan Hasil</button>
        </div>

        <div class="card">
            <h2>Data Radiologi</h2>

            <table>
                <thead>
                    <tr>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>

                <tbody id="tabelRadiologi">
                    <tr>
                        <td>Andi</td>
                        <td>X-Ray</td>
                        <td>Tidak ditemukan kelainan</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>

        function simpanRadiologi() {

            let nama = document.getElementById("namaPasien").value;
            let pemeriksaan = document.getElementById("jenisPemeriksaan").value;
            let hasil = document.getElementById("hasilRadiologi").value;

            if (nama === "" || hasil === "") {
                alert("Semua data harus diisi!");
                return;
            }

            let tabel = document.getElementById("tabelRadiologi");

            let row = tabel.insertRow();

            row.insertCell(0).innerHTML = nama;
            row.insertCell(1).innerHTML = pemeriksaan;
            row.insertCell(2).innerHTML = hasil;

            document.getElementById("namaPasien").value = "";
            document.getElementById("hasilRadiologi").value = "";
            document.getElementById("jenisPemeriksaan").selectedIndex = 0;
            alert("Data berhasil disimpan");
        }

    </script>

</body>

</html>
