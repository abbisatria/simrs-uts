<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a class="active" href="radiologi.html">Radiologi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Radiologi</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">

            <select id="pemeriksaan">
                <option value="">-- Pilih Pemeriksaan --</option>
                <option>X-Ray</option>
                <option>CT Scan</option>
                <option>MRI</option>
                <option>USG</option>
            </select>

            <input type="text" id="hasilRadiologi" placeholder="Hasil Radiologi">

            <button onclick="simpanRadiologi()">Simpan Hasil</button>
            <button onclick="hapusData()">Hapus Data</button>
        </div>

        <div class="card">
            <h2>Data Radiologi</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>

                <tbody id="dataRadiologi"></tbody>
            </table>
        </div>

    </div>

    <script>
        let radiologi = JSON.parse(
            localStorage.getItem("radiologi")
        ) || [];

        renderTable();

        function simpanRadiologi() {
            let pasien = document.getElementById("namaPasien").value;
            let pemeriksaan = document.getElementById("pemeriksaan").value;
            let hasil = document.getElementById("hasilRadiologi").value;

            if (pasien && pemeriksaan && hasil) {

                radiologi.push({
                    pasien: pasien,
                    pemeriksaan: pemeriksaan,
                    hasil: hasil
                });

                localStorage.setItem(
                    "radiologi",
                    JSON.stringify(radiologi)
                );

                console.log(radiologi);

                renderTable();

                document.getElementById("namaPasien").value = "";
                document.getElementById("pemeriksaan").selectedIndex = 0;
                document.getElementById("hasilRadiologi").value = "";

                alert("Data radiologi berhasil disimpan");

            } else {
                alert("Semua data harus diisi");
            }
        }

        function renderTable() {
            let html = "";

            radiologi.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.pasien}</td>
                        <td>${item.pemeriksaan}</td>
                        <td>${item.hasil}</td>
                    </tr>
                `;
            });

            document.getElementById("dataRadiologi").innerHTML = html;
        }

        function hapusData() {
            if (confirm("Yakin ingin menghapus semua data?")) {
                localStorage.removeItem("radiologi");
                radiologi = [];
                renderTable();
            }
        }
    </script>

</body>

</html>
