<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a class="active" href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="kasir.html">Kasir</a>
        <a href="Radiologi.html">Radiologi</a>
        <a href="Laboratorium.html">Laboratorium</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Form Pendaftaran</h2>
            <input id="input-nama-pendaftaran" placeholder="Nama Pasien">
            <select id="select-poli">
                <option>Poli Umum</option>
                <option>Poli Gigi</option>
            </select>
            <br />
            <button id="btn-simpan-pendaftaran">Simpan</button>
        </div>

        <div class="card">
            <h2>List Pendaftaran</h2>
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Poli</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tbody-pendaftaran"></tbody>
            </table>
        </div>

    </div>
    <script src="Script.js"></script>
</body>

</html>
