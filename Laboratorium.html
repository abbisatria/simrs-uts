        <!-- Form Radiologi -->
        <div class="card">
            <h2>Laboratorium</h2>

            <div class="form-group">
                <input type="text" placeholder="Nama Pasien">
            </div>

            <div class="form-group">
                <select>
                    <option>Hermatologi</option>
                    <option>Mikrobiologi</option>

            <div class="form-group">
                <input placeholder="Hasil Laboratorium"></textarea>

            <button>Simpan Hasil</button>
        </div>

        <!-- Data Radiologi -->
        <div class="card">
            <h2>Data Hasil Pemeriksaan Lab</h2>

            <table>
                <thead>
                    <tr>
                        <th>Pasien</th>
                        <th>Pemeriksaan</th>
                        <th>Hasil</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Siti</td>
                        <td>Hermatologi</td>
                        <td>Hasil</td>
                    </tr>
                </tbody>
