<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES - Farmasi</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a class="active" href="farmasi.html">Farmasi</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Resep & Farmasi</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">
            <input type="text" id="obat" placeholder="Nama Obat">
            <input type="number" id="jumlah" placeholder="Jumlah">

            <button onclick="tambahObat()">Tambah Obat</button>
            <button onclick="hapusData()">Hapus Data</button>
        </div>

        <div class="card">
            <h2>Daftar Resep</h2>

            <table border="1">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Pasien</th>
                        <th>Obat</th>
                        <th>Qty</th>
                    </tr>
                </thead>

                <tbody id="daftarResep"></tbody>
            </table>
        </div>

    </div>

    <script>
        let resep = JSON.parse(
            localStorage.getItem("resep")
        ) || [];

        renderTable();

        function tambahObat() {
            let namaPasien = document.getElementById("namaPasien").value;
            let obat = document.getElementById("obat").value;
            let jumlah = document.getElementById("jumlah").value;

            if (namaPasien && obat && jumlah) {

                resep.push({
                    pasien: namaPasien,
                    obat: obat,
                    qty: jumlah
                });

                localStorage.setItem(
                    "resep",
                    JSON.stringify(resep)
                );

                console.log(resep);

                renderTable();

                document.getElementById("namaPasien").value = "";
                document.getElementById("obat").value = "";
                document.getElementById("jumlah").value = "";

                alert("Data resep berhasil disimpan");

            } else {
                alert("Semua data harus diisi!");
            }
        }

        function renderTable() {
            let html = "";

            resep.forEach((item, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.pasien}</td>
                        <td>${item.obat}</td>
                        <td>${item.qty}</td>
                    </tr>
                `;
            });

            document.getElementById("daftarResep").innerHTML = html;
        }

        function hapusData() {
            if (confirm("Yakin ingin menghapus semua data resep?")) {
                localStorage.removeItem("resep");
                resep = [];
                renderTable();
            }
        }
    </script>

</body>

</html>
