<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES - Pemeriksaan Poli</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a class="active" href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="kasir.html">Kasir</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <!-- Form Pemeriksaan -->
        <div class="card">
            <h2>Pemeriksaan Poli</h2>

            <input type="text" id="namaPasien" placeholder="Nama Pasien">
            <br><br>

            <input type="text" id="diagnosa" placeholder="Diagnosa">
            <br><br>

            <input type="text" id="tindakan" placeholder="Tindakan">
            <br><br>

            <button onclick="simpanPemeriksaan()">
                Simpan Pemeriksaan
            </button>
        </div>

        <!-- Tabel Pemeriksaan -->
        <div class="card">
            <h2>Antrian Poli</h2>

            <table border="1" width="100%">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Pasien</th>
                        <th>Diagnosa</th>
                        <th>Tindakan</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="tabelPoli">
                </tbody>
            </table>
        </div>

    </div>

    <script>

        // Ambil data dari localStorage
        let dataPoli =
            JSON.parse(localStorage.getItem("dataPoli")) || [];

        // Tampilkan data saat halaman dibuka
        tampilkanData();

        function simpanPemeriksaan() {

            let nama =
                document.getElementById("namaPasien").value;

            let diagnosa =
                document.getElementById("diagnosa").value;

            let tindakan =
                document.getElementById("tindakan").value;

            if (nama === "" || diagnosa === "" || tindakan === "") {
                alert("Semua data harus diisi!");
                return;
            }

            // Simpan data ke array
            dataPoli.push({
                nama: nama,
                diagnosa: diagnosa,
                tindakan: tindakan,
                status: "Dipanggil"
            });

            // Simpan ke localStorage
            localStorage.setItem(
                "dataPoli",
                JSON.stringify(dataPoli)
            );

            // Tampilkan ulang tabel
            tampilkanData();

            // Kosongkan input
            document.getElementById("namaPasien").value = "";
            document.getElementById("diagnosa").value = "";
            document.getElementById("tindakan").value = "";

            alert("Data pemeriksaan berhasil disimpan!");
        }

        function tampilkanData() {

            let html = "";

            dataPoli.forEach((item, index) => {

                html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.nama}</td>
                    <td>${item.diagnosa}</td>
                    <td>${item.tindakan}</td>
                    <td>${item.status}</td>
                </tr>
                `;

            });

            document.getElementById("tabelPoli").innerHTML = html;
        }

    </script>

</body>

</html>
